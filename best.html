<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>냉장/냉동 베스트</title>
<style>
:root{
  --red:#FF0038; --black:#111; --gray3:#333; --gray4:#666;
  --gray10:#DDD; --gray12:#F4F4F4; --gray13:#FAFAFA; --blue:#0B83E6; --yellow:#FFA700;
  --gnb-h:100px;
  --title-h:77px;
  --tabs-h:57px;
}
*{box-sizing:border-box}
html,body{margin:0;background:#2f2f2f;color:var(--black);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
button{font:inherit}
.phone{width:375px;max-width:100vw;margin:0 auto;background:#fff;min-height:100vh;position:relative;padding-bottom:106px}
.gnb-static{height:100px;background:#fff;position:sticky;top:0;z-index:100;overflow:hidden}
.gnb-static img{display:block;width:375px;height:100px;object-fit:cover}
.title-block{height:77px;background:#fff;padding:16px 16px 12px;position:sticky;top:100px;z-index:90;overflow:hidden}
.title-block h1{margin:0;height:24px;font-size:20px;line-height:24px;font-weight:800;letter-spacing:-.5px;font-family:"Apple SD Gothic Neo",Pretendard,sans-serif}.title-block p{margin:5px 0 0;color:var(--gray4);font-size:14px;line-height:20px}
.tabs-wrap{height:57px;background:#FAFAFA;border-top:1px solid #F4F4F4;border-bottom:1px solid #F4F4F4;position:sticky;top:177px;z-index:80;transition:transform .2s ease;overflow:hidden;margin-top:-1px}
.tabs-wrap.hide{transform:translateY(-57px);pointer-events:none}
.tabs{height:57px;display:flex;align-items:center;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 16px}.tabs::-webkit-scrollbar{display:none}
.tab{height:32px;flex:0 0 auto;border:1px solid var(--gray10);border-radius:360px;background:#fff;color:var(--gray3);padding:0 12px;font-size:14px;line-height:30px;font-weight:400;white-space:nowrap}.tab.active{border-color:var(--red);background:rgba(255,0,56,.02);color:var(--red);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;background:#fff}.card{min-width:0;border-bottom:1px solid var(--gray12);position:relative;padding-bottom:12px}.card:nth-child(odd){border-right:1px solid var(--gray12)}
.rank-row{height:44px;padding:10px 12px 0 10px;display:flex;align-items:flex-start}.rank{width:24px;height:24px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:18px;font-weight:400}
.img-box{width:100%;padding:10px 10px 12px}.img-box img{width:167px;height:167px;max-width:100%;object-fit:cover;display:block;background:#fff}
.info-row{position:relative;padding:0 42px 0 16px}.product-name{min-width:0;font-size:15px;line-height:18px;color:#111;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.wish{position:absolute;right:12px;top:0;width:24px;height:24px;border:1px solid var(--gray10);border-radius:50%;background:#fff;color:#888;padding:0;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
.price{padding:6px 16px 0;font-size:20px;line-height:24px;font-weight:700;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Pretendard,sans-serif}.price .discount{color:var(--red);margin-right:4px}.price .won{font-size:14px;font-weight:400}.empty-state{grid-column:1/-1;min-height:280px;display:flex;align-items:center;justify-content:center;color:#999;font-size:14px;background:#fff}
.rating{height:20px;padding:2px 16px 6px;display:flex;align-items:center;gap:4px;font-size:12px;line-height:12px}.stars{color:var(--yellow);letter-spacing:-1px;font-size:12px}.reviews{color:var(--gray4)}
.delivery,.benefit{font-size:14px;line-height:18px;color:var(--gray4);padding-left:16px}.delivery.blue{color:var(--blue)}.benefit b{color:var(--blue);font-weight:400}
.footer{height:152px;background:var(--gray13);padding:16px;color:#999;text-align:center}.footer-links{font-size:13px;line-height:16px;color:#111;margin-bottom:24px}.footer-copy{font-size:10px;line-height:12px}
.bottom-toolbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(375px,100vw);height:98px;background:#fff;z-index:130;border-top:1px solid #ededed;overflow:hidden;display:block}.bottom-toolbar img{display:block;width:100%;height:98px;object-fit:cover}
.to-top{position:absolute;right:16px;bottom:114px;width:40px;height:40px;border:1px solid #ddd;border-radius:4px;background:#fff;font-size:25px}
@media(max-width:374px){.phone{width:100%}.img-box img{width:calc(50vw - 21px);height:calc(50vw - 21px)}}
</style>
</head>

  <section class="grid" id="grid"></section>

</main>

    {name:'신세계푸드 호텔컬렉션 명란왕교자 315g X 4팩',price:'13,070',discount:'42%',image:'https://cdn.011st.com/11dims/resize/600x600/quality/75/11src/product/8799199078/B.webp?676673042',rating:'4.5',reviews:'245',delivery:'8월12일(수)도착',benefit:'1,111P'},

  patty:[

const grid=document.querySelector('#grid');
function renderProducts(key){
  const products=productSets[key]||[];
  if(!products.length){grid.innerHTML='<div class="empty-state">상품 데이터 입력 예정</div>';return;}
  grid.innerHTML=products.map((p,i)=>`<article class="card">
    <div class="rank-row"><div class="rank">${i+1}</div></div>
    <div class="img-box"><img src="${p.image}" alt="${p.name}"></div>
    <div class="info-row"><div class="product-name">${p.name}</div><button class="wish" aria-label="관심상품 추가">♡</button></div>
    <div class="price">${p.discount?`<span class="discount">${p.discount}</span>`:''}${p.price}<span class="won">원</span></div>
    <div class="rating"><span class="stars">${p.rating==='5'?'★★★★★':'★★★★½'}</span><span class="reviews">${p.reviews}</span></div>
    <div class="delivery blue">${p.delivery}</div>
    <div class="benefit">11pay 최대 <b>${p.benefit}</b>적립</div>
  </article>`).join('');
}
const tabs=document.querySelectorAll('.tab');
tabs.forEach(t=>t.addEventListener('click',()=>{tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');t.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});renderProducts(t.dataset.key);}));
const initialKey=new URLSearchParams(location.search).get('tab');
const initialTab=[...tabs].find(t=>t.dataset.key===initialKey) || tabs[0];
tabs.forEach(x=>x.classList.remove('active'));initialTab.classList.add('active');renderProducts(initialTab.dataset.key);
const tabsWrap=document.querySelector('#tabsWrap');let lastY=window.scrollY;let ticking=false;
window.addEventListener('scroll',()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{const y=window.scrollY;const dy=y-lastY;if(y<10||dy<-2)tabsWrap.classList.remove('hide');else if(dy>4)tabsWrap.classList.add('hide');lastY=y;ticking=false;});},{passive:true});
</script>
